<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CurveSmear · Study 01</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111519;color:#edf0ee;font:14px/1.6 system-ui,sans-serif}header{padding:22px 32px;border-bottom:1px solid #30383b;display:flex;justify-content:space-between;align-items:center}h1{margin:0;font-size:22px;letter-spacing:.03em}small,.muted{color:#9ba8ad}main{display:grid;grid-template-columns:minmax(500px,1fr) 300px;gap:24px;padding:24px 32px;max-width:1500px;margin:auto}.stage{position:relative;background:#252d33;border:1px solid #3e484d;border-radius:12px;overflow:hidden;aspect-ratio:800/520;background-image:linear-gradient(45deg,#293238 25%,transparent 25%),linear-gradient(-45deg,#293238 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#293238 75%),linear-gradient(-45deg,transparent 75%,#293238 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0}canvas{width:100%;height:100%;position:absolute;inset:0}#overlay{touch-action:none}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}button,.upload{border:1px solid #46535a;background:#252f35;color:#eef1f1;padding:8px 13px;border-radius:6px;cursor:pointer;font:inherit}button:hover,.upload:hover{border-color:#c5ef89}button.active{color:#d4f7a5;border-color:#9fc96c}aside{background:#1b2227;padding:20px;border-radius:12px}label.control{display:block;margin:19px 0}label.control span{display:flex;justify-content:space-between}input[type=range]{width:100%;accent-color:#c6ed93}input[type=checkbox]{accent-color:#c6ed93}h2{font-size:14px;margin:0 0 12px}hr{border:0;border-top:1px solid #364047;margin:22px 0}.thumbs{display:flex;gap:16px;align-items:flex-start}.thumbs img{max-width:160px;max-height:120px;border-radius:6px}.caption{font-size:12px;color:#aab5b9}.tag{color:#c6ed93;font-size:12px}.footer{margin-top:18px;font-size:12px;color:#aab5b9}@media(max-width:900px){main{grid-template-columns:1fr;padding:16px}header{padding:16px}aside{width:100%}}
</style>
<header><div><div class="tag">MOTION EXPERIMENT / 01</div><h1>CurveSmear</h1></div><small>カーブに沿う、くっきりした引き伸ばし</small></header>
<main><section><div class="stage"><canvas id="render" width="800" height="520"></canvas><canvas id="overlay" width="800" height="520"></canvas></div>
<div class="bar"><button data-preset="arc" class="active">円弧</button><button data-preset="s">S字</button><button data-preset="line">直線</button><button id="compare">元絵と比較</button><button id="save">透過PNGを保存</button></div>
<p class="caption">丸い点をドラッグして軌道を編集。始点 → 終点へ流れ、終点に元絵が配置されます。</p>
<div class="thumbs"><div><div class="caption">REFERENCE</div><img src="../image.png" alt="漫画的なsmearの参考画像"></div><div><div class="caption">SOURCE</div><img id="sourcePreview" alt="現在の入力素材"><div class="caption">模様の曲がり方と輪郭を比較するためのテスト素材</div></div></div>
</section><aside><h2>形を調整</h2>
<label class="control"><span>伸びる長さ <output id="lengthValue"></output></span><input id="length" type="range" min="0" max="600" value="350"></label>
<label class="control"><span>素材の幅 <output id="widthValue"></output></span><input id="width" type="range" min="40" max="230" value="145"></label>
<label class="control"><span>筋の強さ <output id="streakValue"></output></span><input id="streak" type="range" min="0" max="100" value="65"></label>
<label class="control"><span>筋の細かさ <output id="frequencyValue"></output></span><input id="frequency" type="range" min="3" max="35" value="17"></label>
<label class="control"><span>元絵を重ねる量 <output id="originalValue"></output></span><input id="original" type="range" min="0" max="100" value="100"></label>
<label><input id="guide" type="checkbox" checked> カーブを表示</label>
<hr><h2>素材</h2><label class="upload">画像を読み込む<input id="file" type="file" accept="image/*" hidden></label><div class="bar"><button id="resetSource">テスト素材に戻す</button></div><p class="caption">透明PNG推奨。画像の右側を先頭として、カーブ終点の向きに配置します。余白の大きい画像はトリミングしてから読み込んでください。</p>
<hr><div id="status" class="caption" aria-live="polite"></div><p class="footer">静止画の見た目を検証するデモです。カーブが交差したり極端に折れ曲がると、変形が重なる場合があります。</p></aside></main>
<script src="app-v1.js"></script>
</html>
